[theme]
base = "light"
primaryColor = "#0B7A4C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F7F4"
textColor = "#06311F"

[client]
toolbarMode = "minimal"

[server]
# Streamlit's file watcher scans every imported module and trips over parts of
# the transformers library we do not use (torchvision error in the terminal).
fileWatcherType = "none"
